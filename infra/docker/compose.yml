services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHTONG_DATABASE_NAME:-shtong}
      POSTGRES_USER: ${SHTONG_MIGRATION_DATABASE_USER:-shtong_migration}
      POSTGRES_PASSWORD: ${SHTONG_MIGRATION_DATABASE_PASSWORD:?Set SHTONG_MIGRATION_DATABASE_PASSWORD}
      SHTONG_DATABASE_USER: ${SHTONG_DATABASE_USER:-shtong_app}
      SHTONG_DATABASE_PASSWORD: ${SHTONG_DATABASE_PASSWORD:?Set SHTONG_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/001-runtime-principal.sh:/docker-entrypoint-initdb.d/001-runtime-principal.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      SHTONG_ENVIRONMENT: production
      SHTONG_DEV_MODE: "false"
      SHTONG_DATABASE_URL: jdbc:postgresql://postgres:5432/${SHTONG_DATABASE_NAME:-shtong}
      SHTONG_DATABASE_USER: ${SHTONG_DATABASE_USER:-shtong_app}
      SHTONG_DATABASE_PASSWORD: ${SHTONG_DATABASE_PASSWORD:?Set SHTONG_DATABASE_PASSWORD}
      SHTONG_MIGRATION_DATABASE_USER: ${SHTONG_MIGRATION_DATABASE_USER:-shtong_migration}
      SHTONG_MIGRATION_DATABASE_PASSWORD: ${SHTONG_MIGRATION_DATABASE_PASSWORD:?Set SHTONG_MIGRATION_DATABASE_PASSWORD}
      SHTONG_STATE_ENCRYPTION_KEY: ${SHTONG_STATE_ENCRYPTION_KEY:?Set SHTONG_STATE_ENCRYPTION_KEY}
      SHTONG_REFRESH_TOKEN_PEPPER: ${SHTONG_REFRESH_TOKEN_PEPPER:?Set SHTONG_REFRESH_TOKEN_PEPPER}
      SHTONG_BOOTSTRAP_SECRET: ${SHTONG_BOOTSTRAP_SECRET:-}
      SHTONG_BOOTSTRAP_ADMIN_ONE_LOGIN: ${SHTONG_BOOTSTRAP_ADMIN_ONE_LOGIN:-}
      SHTONG_BOOTSTRAP_ADMIN_ONE_PASSWORD: ${SHTONG_BOOTSTRAP_ADMIN_ONE_PASSWORD:-}
      SHTONG_BOOTSTRAP_ADMIN_TWO_LOGIN: ${SHTONG_BOOTSTRAP_ADMIN_TWO_LOGIN:-}
      SHTONG_BOOTSTRAP_ADMIN_TWO_PASSWORD: ${SHTONG_BOOTSTRAP_ADMIN_TWO_PASSWORD:-}
      SHTONG_WEB_ORIGINS: ${SHTONG_WEB_ORIGINS:-http://localhost:5173,http://localhost:5174}
      SHTONG_COOKIE_SECURE: ${SHTONG_COOKIE_SECURE:-true}
    ports: ["127.0.0.1:8080:8080"]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: ["valkey-data:/data"]
    ports: ["127.0.0.1:6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SHTONG_MINIO_ROOT_USER:?Set SHTONG_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SHTONG_MINIO_ROOT_PASSWORD:?Set SHTONG_MINIO_ROOT_PASSWORD}
    volumes: ["minio-data:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

volumes:
  postgres-data:
  valkey-data:
  minio-data:
