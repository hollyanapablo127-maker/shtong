name: Shtong
options:
  bundleIdPrefix: com.shtong
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.10"
    CURRENT_PROJECT_VERSION: "11"
    ASSOCIATED_DOMAIN: "mobile.shtong.example"
    TRUSTED_DOWNLOAD_HOST: ""
configs:
  Debug: debug
  Release: release
targets:
  Shtong:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/Shtong.entitlements
    preBuildScripts:
      - name: Validate release endpoints
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            case "$API_BASE_URL" in ""|*example*) echo "Release API_BASE_URL must be supplied by CI" >&2; exit 1;; esac
            case "$ASSOCIATED_DOMAIN" in ""|*example*) echo "Release ASSOCIATED_DOMAIN must be supplied by CI" >&2; exit 1;; esac
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shtong.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          API_BASE_URL: "http://127.0.0.1:8080/v1/"
        Release:
          API_BASE_URL: "$(SHTONG_RELEASE_API_BASE_URL)"
          ASSOCIATED_DOMAIN: "$(SHTONG_ASSOCIATED_DOMAIN)"
          TRUSTED_DOWNLOAD_HOST: "$(SHTONG_TRUSTED_DOWNLOAD_HOST)"
